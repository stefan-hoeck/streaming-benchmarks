---
name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ github.repository }} with Idris2 latest
    runs-on: ubuntu-latest
    env:
      PACK_DIR: /root/.pack
    strategy:
      fail-fast: false
    container: ghcr.io/stefan-hoeck/idris2-pack:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Build lib
        run: |
          pack -o bench exec fahrenheit/idris2-streams-fahrenheit/src/Main.idrk
          time fahrenheit/idris2-streams-fahrenheit/build/exec/bench small > /dev/null
          time fahrenheit/idris2-streams-fahrenheit/build/exec/bench medium > /dev/null
          time fahrenheit/idris2-streams-fahrenheit/build/exec/bench large > /dev/null
